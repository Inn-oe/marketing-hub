# Render Blueprint: creates the web service AND the Postgres database together.
services:
  - type: web
    name: solar-automation
    runtime: python
    plan: starter
    region: oregon
    buildCommand: pip install .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: solar-db
          property: connectionString
      - key: META_VERIFY_TOKEN
        generateValue: true
      # Secrets: Render prompts for these on first deploy; they are never stored in git.
      - key: META_APP_SECRET
        sync: false
      - key: META_SYSTEM_USER_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: WHATSAPP_SALES_PHONE_ID
        sync: false
      - key: WHATSAPP_WEBSITES_PHONE_ID
        sync: false
      - key: WHATSAPP_SALES_NUMBER
        sync: false
      - key: FB_PAGE_ID
        sync: false

databases:
  - name: solar-db
    plan: basic-256mb
    region: oregon
    databaseName: solar
    user: solar
